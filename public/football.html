<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Field Goal</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:#04060d;
            overscroll-behavior:none;touch-action:none}

  #fg{
    position:fixed; inset:0; z-index:2147483000;
    background:#04060d; color:#fff;
    font:400 14px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none;
    --a:#4f2683; --b:#ffc62f;
    animation:fgIn .6s cubic-bezier(.2,.8,.2,1) both;
  }
  #fg[hidden]{display:none}
  @keyframes fgIn{from{opacity:0;transform:scale(1.02)}to{opacity:1;transform:none}}

  #g{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}

  .ui{
    position:absolute; inset:0; pointer-events:none;
    display:grid; grid-template-rows:auto 1fr auto;
    padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right))
            max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  }
  .row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}

  .card{
    background:linear-gradient(158deg,rgba(255,255,255,.11),rgba(255,255,255,.028));
    border:1px solid rgba(255,255,255,.13);
    border-radius:16px;
    backdrop-filter:blur(16px) saturate(150%);
    -webkit-backdrop-filter:blur(16px) saturate(150%);
    box-shadow:0 14px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12);
  }

  .scoreboard{padding:12px 16px 15px;display:flex;gap:18px;align-items:center;position:relative;overflow:hidden}

  .clock{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.08)}
  .clock i{display:block;height:100%;width:100%;background:var(--b);
           transform-origin:left center;
           transition:transform .1s linear, background .25s ease}
  .clock i.low{background:#ff5f56}

  .lives{display:flex;gap:5px;align-items:center;padding-top:7px}
  .life{width:9px;height:13px;border-radius:50%/38%;background:var(--b);
        box-shadow:0 0 10px color-mix(in srgb, var(--b) 60%, transparent);
        transition:.3s ease;transform:rotate(-20deg)}
  .life.off{background:rgba(255,255,255,.13);box-shadow:none}

  .over{
    position:absolute;inset:0;display:grid;place-items:center;
    background:rgba(3,6,14,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    pointer-events:auto;animation:fgIn .3s ease both;
  }
  .over[hidden]{display:none}
  .overcard{padding:30px 38px 28px;text-align:center;min-width:min(320px,86vw)}
  .overcard .lbl{font-size:10px;letter-spacing:.28em;color:#ff5f56}
  .bigscore{font:800 clamp(46px,11vw,76px)/1 ui-monospace,monospace;
            font-variant-numeric:tabular-nums;color:#fff;margin:6px 0 2px}
  .oversub{font-size:12px;color:rgba(255,255,255,.55);letter-spacing:.06em;margin:0 0 20px}
  .cta{
    all:unset;cursor:pointer;display:block;width:100%;padding:12px 0;border-radius:12px;
    text-align:center;font-weight:700;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;
    color:#06121f;background:var(--b);transition:.18s ease;
  }
  .cta:hover{filter:brightness(1.12);transform:translateY(-1px)}
  .cta:focus-visible{outline:2px solid #fff;outline-offset:3px}
  .lbl{
    font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
    color:rgba(255,255,255,.5);font-weight:600;margin-bottom:1px;
  }
  .val{
    font:700 30px/1 ui-monospace,SFMono-Regular,"Cascadia Mono",Menlo,Consolas,monospace;
    font-variant-numeric:tabular-nums;
    color:#fff;
  }
  .val.sm{font-size:18px;padding-top:6px}
  .val.hot{color:var(--b);text-shadow:0 0 18px color-mix(in srgb, var(--b) 55%, transparent)}
  .sep{width:1px;align-self:stretch;background:linear-gradient(180deg,transparent,rgba(255,255,255,.18),transparent)}

  .left{display:flex;flex-direction:column;gap:9px;align-items:flex-start;min-width:0}
  .right{display:flex;flex-direction:column;gap:9px;align-items:flex-end;flex:0 0 auto;pointer-events:auto}
  .team{
    all:unset;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;
    background:linear-gradient(158deg,rgba(255,255,255,.11),rgba(255,255,255,.028));
    border:1px solid rgba(255,255,255,.13);border-radius:16px;
    backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
    box-shadow:0 14px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12);
    transition:.18s ease;
  }
  .team:hover{border-color:rgba(255,255,255,.28)}
  .team:focus-visible{outline:2px solid var(--b);outline-offset:2px}
  .dot{
    width:11px;height:11px;border-radius:50%;
    background:var(--a);
    box-shadow:0 0 0 2px var(--b), 0 0 16px var(--b);
    transition:background .45s ease, box-shadow .45s ease;
  }
  .team b{font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700}
  .wind{padding:8px 13px;display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.14em;
        text-transform:uppercase;color:rgba(255,255,255,.62);border-radius:12px}
  .wind #uWind{color:#fff;font-variant-numeric:tabular-nums;letter-spacing:.04em}
  .arrow{transition:transform .5s cubic-bezier(.2,.8,.2,1);transform-origin:center}

  .btn{
    all:unset; cursor:pointer; width:38px;height:38px;border-radius:12px;
    display:grid;place-items:center; font-size:14px;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.13);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    color:rgba(255,255,255,.8); transition:.18s ease;
  }
  .btn:hover{background:rgba(255,255,255,.15);color:#fff;transform:translateY(-1px)}
  .btn:active{transform:translateY(0) scale(.95)}
  .btn:focus-visible{outline:2px solid var(--b);outline-offset:2px}
  .btn[aria-pressed="true"]{color:rgba(255,255,255,.32)}

  .center{display:grid;place-items:center;pointer-events:none}
  .title{opacity:0;animation:titleIn 4.6s ease forwards;text-align:center}
  .title h1{
    margin:0; font:800 clamp(34px,9vw,86px)/0.95 ui-sans-serif,system-ui,sans-serif;
    letter-spacing:-.035em;
    color:#fff;
    text-shadow:0 8px 40px rgba(0,0,0,.75), 0 0 60px rgba(120,160,255,.25);
  }
  .title p{margin:8px 0 0;font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--b);opacity:.85}
  @keyframes titleIn{
    0%{opacity:0;transform:translateY(14px) scale(.97)}
    14%{opacity:1;transform:none}
    72%{opacity:1;transform:none}
    100%{opacity:0;transform:translateY(-10px) scale(.99)}
  }

  .hint{
    justify-self:center; padding:9px 15px; border-radius:99px;
    font-size:11px; letter-spacing:.06em; color:rgba(255,255,255,.62);
    display:flex; gap:12px; flex-wrap:wrap; justify-content:center;
  }
  .hint kbd{
    font:600 10px/1 ui-monospace,monospace; letter-spacing:.04em;
    padding:3px 6px;border-radius:6px;color:#fff;
    background:rgba(255,255,255,.11); border:1px solid rgba(255,255,255,.15);
  }
  /* Mobile: nur Punkte, Distanz und Versuche, groessere Touch-Targets */
  @media (max-width:640px){
    .ui{padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right))
                max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
    .hint .desk{display:none}
    .hint{padding:8px 13px}
    .hide-sm{display:none}
    .scoreboard{gap:12px;padding:9px 12px 11px;border-radius:13px}
    .val{font-size:22px}
    .val.sm{font-size:15px;padding-top:5px}
    .team{padding:0;width:44px;height:44px;justify-content:center;border-radius:13px}
    .team b{display:none}
    .wind{padding:7px 11px}
    .right{gap:8px}
    .btn{width:44px;height:44px;border-radius:13px;font-size:15px}
    .overcard{padding:26px 26px 24px}
    .cta{padding:15px 0}
  }
  /* Mobil: kein backdrop-blur (auf Handy-GPUs extrem teuer, weil der
     Canvas darunter jeden Frame neu weichgezeichnet werden muesste).
     Deckkraft kommt stattdessen aus dem Hintergrund. */
  @media (max-width:640px){
    .card,.team,.btn,.over{backdrop-filter:none;-webkit-backdrop-filter:none}
    .card,.team{background:rgba(8,14,28,.86)}
    .btn{background:rgba(8,14,28,.86)}
    .over{background:rgba(3,6,14,.86)}
  }
  /* Querformat auf dem Handy: HUD flach halten */
  @media (max-height:460px){
    .title{display:none}
    .scoreboard{padding:7px 11px 9px}
    .val{font-size:19px}
  }
  @media (prefers-reduced-motion:reduce){
    #fg,.title{animation-duration:.01ms}
  }
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="fg">
  <canvas id="g"></canvas>
  <p class="sr">Interaktive Football-Animation. Ziehen und loslassen kickt den Ball auf das Torgestaenge.</p>

  <div class="ui">
    <div class="row">
     <div class="left">
      <div class="card scoreboard">
        <div><div class="lbl">Punkte</div><div class="val" id="uScore">0</div></div>
        <div class="sep"></div>
        <div><div class="lbl">Distanz</div><div class="val sm" id="uDist">40 yd</div></div>
        <div class="sep hide-sm"></div>
        <div class="hide-sm"><div class="lbl">Streak</div><div class="val sm" id="uStreak">&times;1</div></div>
        <div class="sep hide-sm"></div>
        <div class="hide-sm"><div class="lbl">Best</div><div class="val sm" id="uBest">0</div></div>
        <div class="sep"></div>
        <div>
          <div class="lbl">Versuche</div>
          <div class="lives" id="uLives"><i class="life"></i><i class="life"></i><i class="life"></i></div>
        </div>
        <div class="clock"><i id="uClock"></i></div>
      </div>

      <div class="card wind">
        <svg width="22" height="12" viewBox="-11 -6 22 12" aria-hidden="true">
          <g class="arrow" id="uArrow">
            <path d="M-8 0H6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M3 -3.4L7 0L3 3.4" fill="none" stroke="currentColor" stroke-width="1.6"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </svg>
        <span>Wind</span><span id="uWind">0.0</span>
      </div>
     </div>

      <div class="right">
        <button class="card team" id="uTeamBtn" title="Team wechseln (Leertaste)">
          <span class="dot" id="uDot"></span><b id="uTeam">Vikings</b>
        </button>
        <button class="btn" id="uSound" title="Sound (M)" aria-pressed="false">&#9834;</button>
        <button class="btn" id="uReset" title="Neues Spiel (R)">&#8635;</button>
        <button class="btn" id="uClose" title="Schliessen (Esc)">&#10005;</button>
      </div>
    </div>

    <div class="center"><div class="title"><h1>FIELD&nbsp;GOAL</h1><p>drag to kick</p></div></div>

    <div class="card hint">
      <span><kbd>Drag</kbd> Kick</span>
      <span class="desk"><kbd>Space</kbd> Team</span>
      <span class="desk"><kbd>R</kbd> Neues Spiel</span>
      <span class="desk"><kbd>M</kbd> Sound</span>
      <span class="desk"><kbd>Esc</kbd> Zu</span>
    </div>
  </div>

  <div class="over" id="uOver" hidden>
    <div class="card overcard">
      <div class="lbl">Game Over</div>
      <div class="bigscore" id="uOverScore">0</div>
      <p class="oversub" id="uOverSub">Best 0</p>
      <button class="cta" id="uAgain">Nochmal kicken</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

/* ---------------------------  CONFIG  --------------------------- */
const CONFIG = {
  gravity  : 2.40,  // x Bildschirmhoehe pro s^2
  power    : 5.30,  // Drag-Pixel -> Pixel/s
  attempts : 3,     // Fehlversuche bis Game Over
  playClock: 9,     // Sekunden pro Kick
  bloom    : true,
  sound    : true,
  teams: [
    { name:'Vikings',  a:[ 79, 38,131], b:[255,198, 47] },
    { name:'Chiefs',   a:[227, 24, 55], b:[255,184, 28] },
    { name:'Eagles',   a:[  0, 76, 84], b:[165,172,175] },
    { name:'Cowboys',  a:[  4, 30, 66], b:[134,147,151] },
    { name:'Dolphins', a:[  0,142,151], b:[242,106, 36] },
    { name:'Ravens',   a:[ 26, 25, 95], b:[190,150, 20] },
    { name:'Packers',  a:[ 24, 48, 40], b:[255,184, 28] },
    { name:'Seahawks', a:[  0, 34, 68], b:[105,190, 40] },
  ],
};

/* ---------------------------  SETUP  --------------------------- */
const root   = document.getElementById('fg');
const canvas = document.getElementById('g');
const ctx    = canvas.getContext('2d', { alpha:false });
const bloomC = document.createElement('canvas');
const bctx   = bloomC.getContext('2d');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---- Performance-Tier: Handys rendern die abgespeckte Variante ----
   Teuer auf mobilen GPUs: Bloom (ctx.filter=blur), Filmkorn (overlay),
   shadowBlur, CSS-backdrop-blur (siehe Media-Query oben) und DPR 2.
   Erkennung: grober Zeiger (Touch) oder kleines Display. Falls ein
   Desktop-Geraet trotzdem einbricht, schaltet die Auto-Erkennung im
   Frame-Loop einmalig auf lite um (siehe frame()). */
const PERF = { lite:false, emaDt:1/60, frames:0 };
try {
  PERF.lite = matchMedia('(pointer: coarse)').matches ||
              Math.min(screen.width, screen.height) < 520;
} catch (e) {}
function setLite(){
  if (PERF.lite) return;
  PERF.lite = true;
  resize();   // DPR neu deckeln
}

const ui = {
  score : document.getElementById('uScore'),
  dist  : document.getElementById('uDist'),
  streak: document.getElementById('uStreak'),
  best  : document.getElementById('uBest'),
  lives : document.getElementById('uLives'),
  clock : document.getElementById('uClock'),
  team  : document.getElementById('uTeam'),
  wind  : document.getElementById('uWind'),
  arrow : document.getElementById('uArrow'),
  sound : document.getElementById('uSound'),
  reset : document.getElementById('uReset'),
  close : document.getElementById('uClose'),
  over  : document.getElementById('uOver'),
  oScore: document.getElementById('uOverScore'),
  oSub  : document.getElementById('uOverSub'),
  again : document.getElementById('uAgain'),
};

const rand  = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp  = (a,b,t) => a + (b-a)*t;
const rgba  = (c,a) => 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
const hex   = c => '#' + c.map(v => Math.round(v).toString(16).padStart(2,'0')).join('');

let seed = 1;
const sr = () => (seed = (seed*16807) % 2147483647) / 2147483647;

/* ---------------------------  STATE  --------------------------- */
const S = {
  team:0, score:0, streak:0, best:0,
  level:0, attempts:CONFIG.attempts, phase:'play', clock:CONFIG.playClock, nextIn:0,
  wind:0, windTarget:0, windTimer:0,
  colA:[79,38,131], colB:[255,198,47],
  postGlow:0, cheer:0, flash:0,
  aim:null, dragging:false,
  muted:false, running:false, time:0,
  trail:[], puffs:[], sparks:[], confetti:[], texts:[], rings:[],
};
try { S.best = +(localStorage.getItem('fg.best') || 0) || 0; } catch (e) {}

let W=0, H=0, DPR=1, G=1800, LIFT=200;
const F = {};
let stars=[], skyline=[], crowd=[], lights=[], grain=null;
let VIG=null, VIGW=0, VIGH=0;   // gecachter Vignetten-Gradient (siehe postFX)

/* ---------------------------  LAYOUT  --------------------------- */
function layout(){
  F.groundY   = Math.round(H*0.775);
  F.postX     = Math.round(W - clamp(W*0.15, 92, 260));
  F.postW     = clamp(W*0.10, 62, 150);
  G           = H * CONFIG.gravity;
  LIFT        = Math.min(W, H) * 0.35;
  refreshGate();
  buildScenery();
}

// Schwierigkeit haengt an der Kickdistanz, nicht am Seitenverhaeltnis -
// sonst ist das Torfenster im Hochformat riesig. Pro Treffer wandert der Tee
// zurueck, das Fenster schrumpft exponentiell und der Wind legt zu.
function refreshGate(){
  const lv = S.level;
  F.teeX = clamp(W*0.26 - lv*W*0.021, W*0.05, W*0.26);

  const dist = Math.max(60, F.postX - F.teeX);
  const f    = Math.max(0.11, 0.40 * Math.pow(0.87, lv));   // Fensterhoehe je Distanz
  F.uprightH = clamp(dist*f, H*0.035, H*0.28);

  const bar  = clamp(dist*0.34, H*0.13, H*0.32) * (1 + Math.min(lv,10)*0.022);
  F.crossY   = F.groundY - Math.min(bar, H*0.40);
  F.gateTop  = F.crossY - F.uprightH;

  F.windScale = 1 + Math.min(lv, 14)*0.17;
}

// Kickdistanz in Yards, rein kosmetisch aber gibt dem HUD Bedeutung
function yards(){
  return Math.round(17 + (F.postX - F.teeX)/W * 45);
}

function buildScenery(){
  seed = 20260909;
  stars = [];
  for (let i=0;i<Math.round(W*H/9000);i++)
    stars.push({ x:sr()*W, y:sr()*F.groundY*0.8, r:sr()*1.1+0.25, p:sr()*6.28 });

  skyline = [];
  const base = F.groundY - Math.max(74, H*0.135);
  let x = -60;
  while (x < W+60){
    const w = 46 + sr()*110;
    skyline.push({ x, w, y: base - sr()*Math.max(16, H*0.055) });
    x += w;
  }

  crowd = [];
  for (let i=0;i<Math.round(W*0.9);i++){
    const seg = skyline[Math.floor(sr()*skyline.length)];
    crowd.push({ x: seg.x + sr()*seg.w, y: lerp(seg.y+7, F.groundY-6, sr()), p: sr()*6.28 });
  }

  lights = [0.10,0.34,0.62,0.88].map(f => ({
    x: Math.round(W*f), y: Math.round(H*0.115), spread: W*0.19, p: sr()*6.28,
  }));

  if (!grain){
    grain = document.createElement('canvas');
    grain.width = grain.height = 128;
    const gc = grain.getContext('2d');
    const img = gc.createImageData(128,128);
    for (let i=0;i<img.data.length;i+=4){
      const v = 120 + Math.random()*135;
      img.data[i] = img.data[i+1] = img.data[i+2] = v;
      img.data[i+3] = 255;
    }
    gc.putImageData(img,0,0);
  }
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, PERF.lite ? 1 : 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width  = Math.max(1, Math.round(W*DPR));
  canvas.height = Math.max(1, Math.round(H*DPR));
  bloomC.width  = Math.max(1, Math.round(W*0.30));
  bloomC.height = Math.max(1, Math.round(H*0.30));
  layout();
  if (!ball.x) ball.reset(); else ball.clampIn();
}
addEventListener('resize', resize, { passive:true });
addEventListener('orientationchange', resize, { passive:true });

/* ---------------------------  AUDIO  --------------------------- */
const A = { ctx:null, out:null, noise:null };
function audioBoot(){
  if (A.ctx || !CONFIG.sound) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    A.ctx = new AC();
    A.out = A.ctx.createGain();
    A.out.gain.value = S.muted ? 0 : 0.5;
    A.out.connect(A.ctx.destination);
    const len = A.ctx.sampleRate * 2;
    A.noise = A.ctx.createBuffer(1, len, A.ctx.sampleRate);
    const d = A.noise.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
  } catch (e){ A.ctx = null; }
}
function noiseSrc(){ const s = A.ctx.createBufferSource(); s.buffer = A.noise; s.loop = true; return s; }
function env(node, t0, peak, atk, dec){
  const g = A.ctx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak, t0+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+atk+dec);
  node.connect(g); g.connect(A.out);
  return g;
}
function sfxKick(power){
  if (!A.ctx) return;
  const t = A.ctx.currentTime;
  const o = A.ctx.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(150 + 90*power, t);
  o.frequency.exponentialRampToValueAtTime(48, t+0.18);
  env(o, t, 0.55, 0.005, 0.2); o.start(t); o.stop(t+0.32);

  const n = noiseSrc(), bp = A.ctx.createBiquadFilter();
  bp.type = 'bandpass'; bp.Q.value = 1.1;
  bp.frequency.setValueAtTime(700, t);
  bp.frequency.exponentialRampToValueAtTime(2600, t+0.22);
  n.connect(bp); env(bp, t, 0.20, 0.008, 0.24);
  n.start(t); n.stop(t+0.35);
}
function sfxBounce(v){
  if (!A.ctx) return;
  const t = A.ctx.currentTime;
  const n = noiseSrc(), lp = A.ctx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 400 + 500*v;
  n.connect(lp); env(lp, t, clamp(0.05+0.2*v, 0.02, 0.3), 0.004, 0.1);
  n.start(t); n.stop(t+0.2);
}
function sfxDoink(){
  if (!A.ctx) return;
  const t = A.ctx.currentTime;
  [880, 1318, 1980].forEach((f,i) => {
    const o = A.ctx.createOscillator();
    o.type = i ? 'sine' : 'triangle';
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(f*0.94, t+0.5);
    env(o, t, 0.22/(i+1), 0.003, 0.55 - i*0.12);
    o.start(t); o.stop(t+0.7);
  });
}
function sfxScore(){
  if (!A.ctx) return;
  const t = A.ctx.currentTime;
  [523.25, 659.25, 783.99, 1046.5].forEach((f,i) => {
    const o = A.ctx.createOscillator();
    o.type = 'triangle'; o.frequency.value = f;
    env(o, t + i*0.055, 0.18, 0.01, 0.5);
    o.start(t + i*0.055); o.stop(t + i*0.055 + 0.62);
  });
  const n = noiseSrc(), bp = A.ctx.createBiquadFilter();
  bp.type = 'bandpass'; bp.Q.value = 0.7; bp.frequency.value = 1250;
  n.connect(bp);
  const g = A.ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.26, t+0.22);
  g.gain.exponentialRampToValueAtTime(0.0001, t+2.1);
  bp.connect(g); g.connect(A.out);
  n.start(t); n.stop(t+2.3);
}
function setMuted(m){
  S.muted = m;
  ui.sound.setAttribute('aria-pressed', String(m));
  ui.sound.innerHTML = m ? '&#9835;' : '&#9834;';
  if (A.out) A.out.gain.value = m ? 0 : 0.5;
}

/* ---------------------------  BALL  --------------------------- */
const ball = {
  x:0, y:0, vx:0, vy:0, r:14, angle:0, spin:0, phase:0,
  state:'ready', dead:0, originX:0, crossed:false, resolved:false,

  reset(){
    refreshGate();
    this.r = clamp(Math.hypot(W,H)*0.0125, 10, 20);
    this.x = F.teeX; this.y = F.groundY - this.r - 6;
    this.vx = this.vy = 0;
    this.angle = -0.35; this.spin = 0;
    this.state = 'ready'; this.dead = 0;
    this.crossed = this.resolved = false;
    S.clock = CONFIG.playClock;
    S.trail.length = 0;
    syncUI();
  },
  clampIn(){
    this.x = clamp(this.x, 20, W-20);
    this.y = Math.min(this.y, F.groundY - this.r);
  },
  kick(dx, dy){
    if (this.state !== 'ready' || S.phase !== 'play') return;
    const cap = Math.hypot(W,H) * 1.25;
    let vx = dx * CONFIG.power, vy = dy * CONFIG.power;
    const sp = Math.hypot(vx,vy);
    if (sp > cap){ vx *= cap/sp; vy *= cap/sp; }
    this.vx = Math.max(vx, 40);
    this.vy = vy - LIFT;   // Grundauftrieb, damit auch flache Zuege abheben
    this.spin = 14 + Math.hypot(vx,vy)/H*8;
    this.state = 'flight';
    this.originX = this.x;
    this.crossed = this.resolved = false;
    S.trail.length = 0;
    sfxKick(clamp(sp/cap, 0, 1));
    puff(this.x, this.y + this.r, 14, S.colB);
  },

  update(dt){
    if (this.state === 'ready'){
      this.phase += dt;
      this.y = F.groundY - this.r - 6 - Math.sin(this.phase*1.8)*2.2;
      this.angle = -0.35 + Math.sin(this.phase*1.2)*0.05;
      // Uhr laeuft auch waehrend des Zielens: erzeugt Druck und kann nicht
      // durch ein verlorenes pointerup blockiert werden.
      if (S.phase === 'play'){
        S.clock -= dt;
        if (S.clock <= 0){ S.clock = 0; cancelAim(); resolve(false, 'DELAY OF GAME'); }
      }
      return;
    }
    if (this.state === 'dead'){
      this.dead += dt;
      return;
    }

    const px = this.x, py = this.y;
    this.vy += G*dt;
    this.vx += S.wind*F.windScale*60*dt;
    this.vx -= this.vx*0.16*dt;
    this.vy -= this.vy*0.10*dt;
    this.x  += this.vx*dt;
    this.y  += this.vy*dt;

    // Laengsachse folgt der Flugrichtung: Spirale statt Purzelbaum
    const speed  = Math.hypot(this.vx, this.vy);
    const target = Math.atan2(this.vy, this.vx);
    this.angle = lerp(this.angle, target, clamp(dt*9, 0, 1));
    this.phase += this.spin*dt;

    if (speed > H*0.25) S.trail.push({ x:this.x, y:this.y, a:this.angle, t:0 });
    if (S.trail.length > 16) S.trail.shift();

    // Latte
    const inX = this.x > F.postX - F.postW/2 - this.r && this.x < F.postX + F.postW/2 + this.r;
    if (inX && Math.abs(this.y - F.crossY) < this.r && Math.abs(py - F.crossY) >= this.r){
      this.y = F.crossY + (py < F.crossY ? -this.r : this.r);
      this.vy *= -0.55; this.vx *= 0.6;
      shake(9, 260);
      puff(this.x, F.crossY, 16, S.colB);
      resolve(false, 'DOINK!');
    }

    // Torebene
    if (px < F.postX && this.x >= F.postX && !this.crossed){
      this.crossed = true;
      const good = this.y > F.gateTop && this.y < F.crossY - this.r*0.3;
      resolve(good, this.y <= F.gateTop ? 'ZU HOCH' : 'NO GOOD');
    }

    // Boden
    if (this.y + this.r > F.groundY){
      this.y = F.groundY - this.r;
      const impact = clamp(Math.abs(this.vy)/(H*1.2), 0, 1);
      if (impact > 0.03) sfxBounce(impact);
      this.vy *= -0.42; this.vx *= 0.78; this.spin *= 0.6;
      puff(this.x, F.groundY, 6 + Math.round(impact*14), [190,220,190]);
      if (Math.abs(this.vy) < H*0.06 && Math.abs(this.vx) < W*0.03){
        this.state = 'dead';
        resolve(false, 'ZU KURZ');
      }
    }

    if (this.x > W + 240 || this.x < -240 || this.y > H + 400){
      this.state = 'dead';
      resolve(false, 'NO GOOD');
    }
  },
};

/* ---------------------------  SPIELREGELN  --------------------------- */
// Jeder Kick endet genau einmal: Treffer oder Fehlversuch.
function resolve(good, label){
  if (S.phase !== 'play' || ball.resolved) return;
  ball.resolved = true;

  if (good){
    const yd   = yards();
    const mult = 1 + Math.min(S.streak, 6)*0.5;
    const pts  = Math.round((3 + Math.max(0, Math.round((yd-30)/6))) * mult);

    S.score  += pts;
    S.streak += 1;
    S.level  += 1;
    if (S.score > S.best){
      S.best = S.score;
      try { localStorage.setItem('fg.best', String(S.best)); } catch (e) {}
    }

    S.postGlow = 1; S.cheer = 1; S.flash = 1;
    confetti(F.postX, F.gateTop + F.uprightH*0.4, (REDUCED || PERF.lite) ? 70 : 190);
    ring(F.postX, F.gateTop + F.uprightH*0.45);
    shake(REDUCED ? 4 : 16, 480);
    text(F.postX, F.gateTop - 42, '+' + pts, '#ffffff', 1.35);
    if (S.streak > 1) text(F.postX, F.gateTop - 92, 'STREAK x' + S.streak, hex(S.colB), 0.95);
    sfxScore();
    S.nextIn = 1.5;
  } else {
    S.attempts -= 1;
    S.streak = 0;
    text(ball.x, ball.y - 40, label || 'NO GOOD', '#ff5f56', 1.05);
    shake(REDUCED ? 3 : 7, 220);
    sfxDoink();
    S.nextIn = 1.2;
  }
  syncUI();
}

function nextAttempt(){
  if (S.attempts <= 0) gameOver();
  else ball.reset();
}

function gameOver(){
  S.phase = 'over';
  S.aim = null; S.dragging = false;
  ui.oScore.textContent = S.score;
  ui.oSub.textContent = 'Best ' + S.best + '  ·  ' + S.level +
                        (S.level === 1 ? ' Field Goal' : ' Field Goals');
  ui.over.hidden = false;
  ui.again.focus();
}

function newGame(){
  S.score = 0; S.streak = 0; S.level = 0;
  S.attempts = CONFIG.attempts;
  S.phase = 'play';
  S.nextIn = 0;
  S.confetti.length = S.texts.length = S.rings.length = 0;
  ui.over.hidden = true;
  refreshGate();
  ball.reset();
}

/* ---------------------------  PARTIKEL  --------------------------- */
function puff(x, y, n, col){
  if (REDUCED) n = Math.round(n*0.4);
  for (let i=0;i<n;i++){
    const a = rand(-Math.PI, 0), sp = rand(20, 200);
    S.puffs.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp*0.6,
                   r:rand(1.5,4.5), t:0, life:rand(0.3,0.75), c:col.slice() });
  }
}
function sparkle(x, y, col){
  S.sparks.push({ x, y, vx:rand(-70,70), vy:rand(-70,70), t:0,
                  life:rand(0.25,0.6), r:rand(1,2.8), c:col.slice() });
}
function confetti(x, y, n){
  for (let i=0;i<n;i++){
    S.confetti.push({
      x: x + rand(-70,70), y: y + rand(-50,50),
      w: rand(3,7), h: rand(7,13),
      vx: rand(-190,190), vy: rand(-520,-140),
      rot: rand(0,6.28), vr: rand(-9,9),
      t:0, life: rand(1.6,3.0),
      c: (Math.random() < 0.5 ? S.colA : S.colB).slice(),
    });
  }
}
function ring(x, y){ S.rings.push({ x, y, t:0, life:0.85 }); }
function text(x, y, str, color, scale){
  // im Bild halten, damit Popups nicht hinter HUD oder Rand verschwinden
  S.texts.push({ x: clamp(x, W*0.14, W*0.86), y: Math.max(y, H*0.12),
                 str, color, t:0, life:1.35, s:scale || 1 });
}

function updateParticles(dt){
  for (let i=S.puffs.length-1;i>=0;i--){
    const p = S.puffs[i]; p.t += dt;
    if (p.t > p.life){ S.puffs.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 120*dt; p.vx *= 1 - 1.6*dt;
  }
  for (let i=S.sparks.length-1;i>=0;i--){
    const s = S.sparks[i]; s.t += dt;
    if (s.t > s.life){ S.sparks.splice(i,1); continue; }
    s.x += s.vx*dt; s.y += s.vy*dt; s.vy += 200*dt;
  }
  for (let i=S.confetti.length-1;i>=0;i--){
    const c = S.confetti[i]; c.t += dt;
    if (c.t > c.life){ S.confetti.splice(i,1); continue; }
    c.x += c.vx*dt; c.y += c.vy*dt; c.vy += 620*dt; c.vx *= 1 - 0.9*dt;
    c.rot += c.vr*dt;
  }
  for (let i=S.rings.length-1;i>=0;i--){
    const r = S.rings[i]; r.t += dt;
    if (r.t > r.life) S.rings.splice(i,1);
  }
  for (let i=S.texts.length-1;i>=0;i--){
    const t = S.texts[i]; t.t += dt;
    if (t.t > t.life){ S.texts.splice(i,1); continue; }
    t.y -= 34*dt;
  }
  for (const t of S.trail) t.t += dt;
}

/* ---------------------------  KAMERA  --------------------------- */
const cam = { mag:0, until:0, span:1 };
function shake(mag, ms){
  if (REDUCED) mag *= 0.25;
  cam.mag  = Math.max(cam.mag, mag);
  cam.span = ms;
  cam.until = Math.max(cam.until, performance.now() + ms);
}

/* ---------------------------  INPUT  --------------------------- */
function pt(e){
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
canvas.addEventListener('pointerdown', e => {
  audioBoot();
  if (A.ctx && A.ctx.state === 'suspended') A.ctx.resume();
  if (S.phase !== 'play' || ball.state !== 'ready') return;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  S.dragging = true;
  const p = pt(e);
  S.aim = { sx:p.x, sy:p.y, x:p.x, y:p.y };
});
canvas.addEventListener('pointermove', e => {
  if (!S.dragging || !S.aim) return;
  const p = pt(e);
  S.aim.x = p.x; S.aim.y = p.y;
});
function release(){
  if (!S.dragging) return;
  S.dragging = false;
  const a = S.aim; S.aim = null;
  if (!a) return;
  const dx = a.x - a.sx, dy = a.y - a.sy;
  if (Math.hypot(dx,dy) > 8) ball.kick(dx, dy);
}
canvas.addEventListener('pointerup', release);
addEventListener('pointerup', release);
function cancelAim(){ S.dragging = false; S.aim = null; }
canvas.addEventListener('pointercancel', cancelAim);
canvas.addEventListener('lostpointercapture', () => { if (S.dragging) cancelAim(); });
// Fensterwechsel bricht den Zug ab, statt ihn als Kick zu werten
addEventListener('blur', cancelAim);
document.addEventListener('visibilitychange', () => { if (document.hidden) cancelAim(); });

addEventListener('keydown', e => {
  if (!S.running) return;
  if (e.code === 'Space'){
    e.preventDefault();
    if (S.phase === 'over') newGame(); else cycleTeam();
  }
  else if (e.code === 'Enter' && S.phase === 'over'){ e.preventDefault(); newGame(); }
  else if (e.code === 'KeyR'){ newGame(); }
  else if (e.code === 'KeyM'){ audioBoot(); setMuted(!S.muted); }
  else if (e.code === 'Escape'){ closeGame(); }
});

function cycleTeam(){
  S.team = (S.team + 1) % CONFIG.teams.length;
  syncUI();
  for (let i=0;i<24;i++) sparkle(ball.x + rand(-20,20), ball.y + rand(-20,20), CONFIG.teams[S.team].b);
}

document.getElementById('uTeamBtn').onclick = () => cycleTeam();
ui.reset.onclick = () => newGame();
ui.again.onclick = () => newGame();
ui.sound.onclick = () => { audioBoot(); setMuted(!S.muted); };
ui.close.onclick = () => closeGame();

/* ---------------------------  HUD  --------------------------- */
ui.lives.innerHTML = '<i class="life"></i>'.repeat(Math.max(1, CONFIG.attempts));
const lifeEls = Array.from(ui.lives.children);
function syncUI(){
  const t = CONFIG.teams[S.team];
  const mult = 1 + Math.min(S.streak, 6)*0.5;
  ui.score.textContent  = S.score;
  ui.dist.textContent   = yards() + ' yd';
  ui.streak.textContent = 'x' + (mult % 1 ? mult.toFixed(1) : mult);
  ui.streak.classList.toggle('hot', S.streak > 0);
  ui.best.textContent   = S.best;
  ui.team.textContent   = t.name;
  lifeEls.forEach((el, i) => el.classList.toggle('off', i >= S.attempts));
  root.style.setProperty('--a', hex(t.a));
  root.style.setProperty('--b', hex(t.b));
}

/* ---------------------------  RENDER  --------------------------- */
function drawSky(){
  const g = ctx.createLinearGradient(0, -60, 0, F.groundY + 60);
  g.addColorStop(0,    '#03050b');
  g.addColorStop(0.42, '#071022');
  g.addColorStop(1,    '#0c1e35');
  ctx.fillStyle = g;
  ctx.fillRect(-80, -80, W+160, F.groundY+140);

  ctx.globalCompositeOperation = 'lighter';
  for (const s of stars){
    const tw = 0.35 + 0.65*Math.abs(Math.sin(S.time*0.0011 + s.p));
    ctx.fillStyle = 'rgba(200,220,255,' + (0.35*tw).toFixed(3) + ')';
    ctx.fillRect(s.x, s.y, s.r, s.r);
  }
  if (!PERF.lite) for (let i=0;i<3;i++){
    const p = S.time*0.00007*(i+1);
    const x = W*(0.28 + 0.40*Math.sin(p + i*2.1));
    const y = H*(0.16 + 0.12*Math.cos(p*1.35 + i));
    const r = Math.max(W,H)*(0.30 + 0.07*i);
    const col = i % 2 ? S.colB : S.colA;
    const rg = ctx.createRadialGradient(x,y,0,x,y,r);
    rg.addColorStop(0,    rgba(col, 0.15));
    rg.addColorStop(0.45, rgba(col, 0.05));
    rg.addColorStop(1,    rgba(col, 0));
    ctx.fillStyle = rg;
    ctx.fillRect(x-r, y-r, r*2, r*2);
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawStadium(){
  ctx.fillStyle = '#050a15';
  for (const s of skyline) ctx.fillRect(s.x, s.y, s.w+1, F.groundY - s.y + 2);

  const boost = 1 + S.cheer*2.2;
  const cStep = PERF.lite ? 2 : 1;
  for (let ci=0; ci<crowd.length; ci+=cStep){
    const c = crowd[ci];
    const tw = 0.25 + 0.75*Math.abs(Math.sin(S.time*0.004 + c.p));
    const a  = clamp(0.10*tw*boost, 0, 0.75);
    const jump = S.cheer > 0.05 ? Math.sin(S.time*0.02 + c.p)*2.2*S.cheer : 0;
    ctx.fillStyle = tw > 0.85 ? rgba(S.colB, a) : 'rgba(200,215,240,' + a.toFixed(3) + ')';
    ctx.fillRect(c.x, c.y + jump, 2, 2);
  }

  ctx.strokeStyle = '#070d1a';
  ctx.lineWidth = 5;
  for (const L of lights){
    ctx.beginPath(); ctx.moveTo(L.x, F.groundY); ctx.lineTo(L.x, L.y); ctx.stroke();
    ctx.fillStyle = '#0b1424';
    ctx.fillRect(L.x-26, L.y-13, 52, 15);
  }

  if (!PERF.lite){
  ctx.globalCompositeOperation = 'lighter';
  for (const L of lights){
    const flick = 0.86 + 0.14*Math.sin(S.time*0.0013 + L.p);
    const cone = ctx.createLinearGradient(0, L.y, 0, F.groundY);
    cone.addColorStop(0, 'rgba(178,206,255,' + (0.085*flick).toFixed(3) + ')');
    cone.addColorStop(1, 'rgba(178,206,255,0)');
    ctx.fillStyle = cone;
    ctx.beginPath();
    ctx.moveTo(L.x-24, L.y);
    ctx.lineTo(L.x+24, L.y);
    ctx.lineTo(L.x + L.spread, F.groundY);
    ctx.lineTo(L.x - L.spread, F.groundY);
    ctx.closePath(); ctx.fill();

    const bg = ctx.createRadialGradient(L.x, L.y-4, 0, L.x, L.y-4, 68);
    bg.addColorStop(0,    'rgba(226,240,255,' + (0.85*flick).toFixed(3) + ')');
    bg.addColorStop(0.16, 'rgba(190,215,255,0.30)');
    bg.addColorStop(1,    'rgba(160,195,255,0)');
    ctx.fillStyle = bg;
    ctx.fillRect(L.x-70, L.y-74, 140, 140);
  }
  ctx.globalCompositeOperation = 'source-over';
  }
}

function drawField(){
  const gy = F.groundY;
  ctx.save();
  ctx.beginPath(); ctx.rect(-80, gy, W+160, H-gy+80); ctx.clip();

  const g = ctx.createLinearGradient(0, gy, 0, H+40);
  g.addColorStop(0,   '#12432a');
  g.addColorStop(0.3, '#0c3120');
  g.addColorStop(1,   '#04150d');
  ctx.fillStyle = g; ctx.fillRect(-80, gy, W+160, H-gy+80);

  const sw = Math.max(48, W/16);
  for (let i=-1; i*sw < W+80; i+=2){
    ctx.fillStyle = 'rgba(255,255,255,0.024)';
    ctx.fillRect(i*sw, gy, sw, H);
  }

  const step = Math.max(52, W/18);
  ctx.lineWidth = 1;
  for (let i=0; i*step < W+step; i++){
    const x = i*step;
    ctx.strokeStyle = 'rgba(255,255,255,0.13)';
    ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x, H); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.09)';
    ctx.beginPath(); ctx.moveTo(x+step/2, gy+8); ctx.lineTo(x+step/2, gy+22); ctx.stroke();
  }

  const nums = ['10','20','30','40','50','40','30','20','10'];
  ctx.font = '700 ' + Math.round(clamp(H*0.028, 13, 30)) + 'px ui-sans-serif,system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  for (let i=0;i<nums.length;i++)
    ctx.fillText(nums[i], W*(i+0.7)/(nums.length+0.4), gy + clamp(H*0.055, 26, 58));
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

  ctx.fillStyle = 'rgba(190,255,215,0.14)';
  ctx.fillRect(-80, gy-1, W+160, 1.5);

  if (ball.state !== 'dead'){
    const h = clamp(1 - (gy - ball.y)/(H*0.45), 0, 1);
    const rg = ctx.createRadialGradient(ball.x, gy, 0, ball.x, gy, 90*h + 25);
    rg.addColorStop(0, rgba(S.colB, 0.16*h));
    rg.addColorStop(1, rgba(S.colB, 0));
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = rg; ctx.fillRect(ball.x-140, gy-40, 280, 180);
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();

  if (ball.state === 'ready'){
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.beginPath();
    ctx.moveTo(F.teeX-5, gy); ctx.lineTo(F.teeX+5, gy); ctx.lineTo(F.teeX, gy-8);
    ctx.closePath(); ctx.fill();
  }
}

function drawPost(){
  const { postX, postW, crossY, groundY, uprightH } = F;
  const up = crossY - uprightH;

  if (S.postGlow > 0.002){
    ctx.globalCompositeOperation = 'lighter';
    const cy = crossY - uprightH*0.45;
    const r  = Math.max(220, uprightH*1.4);
    const g  = ctx.createRadialGradient(postX, cy, 0, postX, cy, r);
    g.addColorStop(0,   rgba(S.colB, 0.42*S.postGlow));
    g.addColorStop(0.5, rgba(S.colB, 0.10*S.postGlow));
    g.addColorStop(1,   rgba(S.colB, 0));
    ctx.fillStyle = g;
    ctx.fillRect(postX-r, cy-r, r*2, r*2);
    ctx.globalCompositeOperation = 'source-over';
  }

  // Torfenster andeuten
  ctx.fillStyle = rgba(S.colB, 0.05 + 0.09*S.postGlow);
  ctx.fillRect(postX-1.5, F.gateTop, 3, crossY - F.gateTop);

  const metal = ctx.createLinearGradient(0, up, 0, groundY);
  metal.addColorStop(0,    'rgba(255,255,255,0.95)');
  metal.addColorStop(0.25, rgba(S.colB, 1));
  metal.addColorStop(1,    rgba(S.colB, 0.55));

  ctx.save();
  ctx.lineCap = 'round';
  ctx.strokeStyle = metal;
  ctx.shadowColor = rgba(S.colB, 0.55 + 0.4*S.postGlow);
  ctx.shadowBlur  = PERF.lite ? 0 : 16 + 26*S.postGlow;

  ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(postX, groundY); ctx.lineTo(postX, crossY); ctx.stroke();

  ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.moveTo(postX - postW/2, crossY); ctx.lineTo(postX + postW/2, crossY);
  ctx.stroke();

  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(postX - postW/2, crossY); ctx.lineTo(postX - postW/2, up);
  ctx.moveTo(postX + postW/2, crossY); ctx.lineTo(postX + postW/2, up);
  ctx.stroke();
  ctx.restore();

  // Wimpel zeigen den Wind
  const wob = Math.sin(S.time*0.004)*0.35 + S.wind*140;
  for (const sx of [postX - postW/2, postX + postW/2]){
    ctx.save();
    ctx.translate(sx, up);
    ctx.rotate(-1.15 + clamp(wob, -0.9, 0.9)*0.4);
    ctx.fillStyle = rgba(S.colA, 0.9);
    ctx.beginPath();
    ctx.moveTo(0,0); ctx.lineTo(26,-5); ctx.lineTo(0,9);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

function drawBall(){
  const r = ball.r;

  ctx.globalCompositeOperation = 'lighter';
  for (let i=0;i<S.trail.length;i++){
    const t = S.trail[i];
    const k = (i+1)/S.trail.length;
    const a = k*k*0.28*clamp(1 - t.t*2.2, 0, 1);
    if (a <= 0.002) continue;
    ctx.save();
    ctx.translate(t.x, t.y); ctx.rotate(t.a);
    ctx.fillStyle = rgba(S.colB, a);
    ctx.beginPath();
    ctx.ellipse(0, 0, r*1.5*k, r*0.9*k, 0, 0, 6.2832);
    ctx.fill();
    ctx.restore();
  }
  const glow = ctx.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, r*5);
  glow.addColorStop(0, rgba(S.colB, 0.22));
  glow.addColorStop(1, rgba(S.colB, 0));
  ctx.fillStyle = glow;
  ctx.fillRect(ball.x - r*5, ball.y - r*5, r*10, r*10);
  ctx.globalCompositeOperation = 'source-over';

  const dh = clamp((F.groundY - ball.y)/(H*0.5), 0, 1);
  ctx.fillStyle = 'rgba(0,0,0,' + (0.34*(1-dh)).toFixed(3) + ')';
  ctx.beginPath();
  ctx.ellipse(ball.x, F.groundY+2, r*1.5*(1-dh*0.4), r*0.4*(1-dh*0.5), 0, 0, 6.2832);
  ctx.fill();

  ctx.save();
  ctx.translate(ball.x, ball.y);
  ctx.rotate(ball.angle);
  ctx.scale(1, 0.94 + 0.06*Math.cos(ball.phase));

  const rx = r*1.5, ry = r;
  const body = ctx.createRadialGradient(-rx*0.35, -ry*0.5, r*0.1, 0, 0, rx*1.35);
  body.addColorStop(0,    '#c1703c');
  body.addColorStop(0.42, '#8c451c');
  body.addColorStop(0.85, '#4a1f0c');
  body.addColorStop(1,    '#251006');
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.ellipse(0,0,rx,ry,0,0,6.2832); ctx.fill();

  ctx.strokeStyle = 'rgba(255,225,190,0.25)';
  ctx.lineWidth = Math.max(1, r*0.08);
  ctx.beginPath(); ctx.ellipse(0,0,rx,ry,0,0,6.2832); ctx.stroke();

  ctx.strokeStyle = 'rgba(255,240,220,0.30)';
  ctx.lineWidth = Math.max(1, r*0.07);
  ctx.beginPath();
  ctx.moveTo(-rx*0.92, 0);
  ctx.quadraticCurveTo(0, -ry*0.42, rx*0.92, 0);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = Math.max(1.4, r*0.13);
  for (const sx of [-0.68, 0.68]){
    ctx.beginPath();
    ctx.ellipse(rx*sx, 0, ry*0.28, ry*0.78, 0, -0.95, 0.95);
    ctx.stroke();
  }

  ctx.strokeStyle = 'rgba(255,255,255,0.95)';
  ctx.lineWidth = Math.max(1.2, r*0.1);
  ctx.beginPath();
  ctx.moveTo(-rx*0.34, -ry*0.16); ctx.lineTo(rx*0.34, -ry*0.16);
  for (let i=-3;i<=3;i++){
    const x = i*rx*0.11;
    ctx.moveTo(x, -ry*0.34); ctx.lineTo(x, ry*0.02);
  }
  ctx.stroke();
  ctx.restore();
}

function drawParticles(){
  ctx.globalCompositeOperation = 'lighter';
  for (const p of S.puffs){
    const a = 1 - p.t/p.life;
    ctx.fillStyle = rgba(p.c, a*0.45);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r*(1 + p.t*2), 0, 6.2832); ctx.fill();
  }
  for (const s of S.sparks){
    const a = 1 - s.t/s.life;
    ctx.strokeStyle = rgba(s.c, a);
    ctx.lineWidth = s.r*0.6;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x - s.vx*0.03, s.y - s.vy*0.03);
    ctx.stroke();
  }
  for (const r of S.rings){
    const k = r.t/r.life, a = 1-k;
    ctx.strokeStyle = rgba(S.colB, a*0.55);
    ctx.lineWidth = 6*(1-k) + 1;
    ctx.beginPath(); ctx.arc(r.x, r.y, k*Math.max(W,H)*0.32, 0, 6.2832); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';

  for (const c of S.confetti){
    const k = c.t/c.life;
    const a = clamp(1 - k*k, 0, 1);
    ctx.save();
    ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.fillStyle = rgba(c.c, a);
    ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h*(0.4 + 0.6*Math.abs(Math.cos(c.rot*1.7))));
    ctx.restore();
  }
}

function drawAim(){
  if (!S.aim) return;
  const a  = S.aim;
  const dx = a.x - a.sx, dy = a.y - a.sy;
  const dist = Math.hypot(dx, dy);
  if (dist < 8) return;

  const cap   = Math.hypot(W,H)*1.25;
  const power = clamp(dist*CONFIG.power/cap, 0, 1);

  // Flugbahn-Vorschau mit exakt derselben Integration wie die Physik
  let px = ball.x, py = ball.y;
  let vx = Math.max(dx*CONFIG.power, 40), vy = dy*CONFIG.power - LIFT;
  const sp = Math.hypot(dx*CONFIG.power, dy*CONFIG.power);
  if (sp > cap){ vx = Math.max(dx*CONFIG.power*cap/sp, 40); vy = dy*CONFIG.power*cap/sp - LIFT; }
  // Nur ein kurzer Anlauf-Stummel: zeigt Richtung und Drall, verraet aber
  // nicht den Auftreffpunkt. Zielen bleibt Gefuehlssache.
  const h = 1/90, STEPS = 34;
  ctx.globalCompositeOperation = 'lighter';
  for (let i=0;i<STEPS;i++){
    vy += G*h; vx += S.wind*F.windScale*60*h;
    vx -= vx*0.16*h; vy -= vy*0.10*h;
    px += vx*h; py += vy*h;
    if (py > F.groundY - ball.r || px > W+40) break;
    if (i % 5 === 0){
      const k = 1 - i/STEPS;
      ctx.fillStyle = 'rgba(255,255,255,' + (0.42*k*k).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(px, py, 1.2 + 2.0*k, 0, 6.2832); ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over';

  const R = ball.r*2.6;
  ctx.strokeStyle = 'rgba(255,255,255,0.14)';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, R, 0, 6.2832); ctx.stroke();
  ctx.strokeStyle = rgba(S.colB, 0.95);
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(ball.x, ball.y, R, -Math.PI/2, -Math.PI/2 + 6.2832*power); ctx.stroke();
  ctx.lineCap = 'butt';
  // Bewusst kein Zugpfeil: Zielen bleibt Gefuehlssache (schwerer).
}

function hexToRgba(h, a){
  if (h && h[0] === '#' && h.length === 7){
    return 'rgba(' + parseInt(h.slice(1,3),16) + ',' + parseInt(h.slice(3,5),16) + ','
                   + parseInt(h.slice(5,7),16) + ',' + a + ')';
  }
  return 'rgba(255,255,255,' + a + ')';
}

function drawTexts(){
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of S.texts){
    const k = t.t/t.life;
    const a = clamp(1 - k*k, 0, 1);
    const pop = 1 + Math.max(0, 0.35 - k)*1.6;
    const size = Math.round(clamp(H*0.045, 22, 54)*t.s*pop);
    ctx.font = '800 ' + size + 'px ui-sans-serif,system-ui,sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,' + (0.35*a).toFixed(3) + ')';
    ctx.fillText(t.str, t.x+2, t.y+3);
    if (!PERF.lite){ ctx.shadowColor = t.color; ctx.shadowBlur = 22*a; }
    ctx.fillStyle = hexToRgba(t.color, a);
    ctx.fillText(t.str, t.x, t.y);
    ctx.shadowBlur = 0;
  }
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

function postFX(){
  // Bloom: Bright-Pass via Selbstmultiplikation, dann additiv hochskaliert zurueck
  // (nur Full-Tier: ctx.filter=blur ist auf Handy-GPUs der groesste Frame-Fresser)
  if (CONFIG.bloom && !REDUCED && !PERF.lite){
    try {
      bctx.globalCompositeOperation = 'copy';
      bctx.drawImage(canvas, 0, 0, bloomC.width, bloomC.height);
      bctx.globalCompositeOperation = 'multiply';
      bctx.drawImage(bloomC, 0, 0);
      bctx.drawImage(bloomC, 0, 0);
      ctx.setTransform(1,0,0,1,0,0);
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.9;
      ctx.filter = 'blur(3px)';
      ctx.drawImage(bloomC, 0, 0, canvas.width, canvas.height);
      ctx.filter = 'none';
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    } catch (e){ CONFIG.bloom = false; }
  }

  ctx.setTransform(DPR,0,0,DPR,0,0);

  if (S.flash > 0.002){
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,255,255,' + (0.20*S.flash*S.flash).toFixed(4) + ')';
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = 'source-over';
  }

  // Vignette: Gradient nur bei Groessenaenderung neu aufbauen, nicht pro Frame
  if (!VIG || VIGW !== W || VIGH !== H){
    VIG = ctx.createRadialGradient(W*0.5, H*0.48, Math.min(W,H)*0.32,
                                   W*0.5, H*0.50, Math.max(W,H)*0.78);
    VIG.addColorStop(0, 'rgba(0,0,0,0)');
    VIG.addColorStop(1, 'rgba(0,0,0,0.62)');
    VIGW = W; VIGH = H;
  }
  ctx.fillStyle = VIG; ctx.fillRect(0,0,W,H);

  if (grain && !PERF.lite){
    ctx.globalAlpha = 0.035;
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = ctx.createPattern(grain, 'repeat');
    ctx.save();
    ctx.translate((S.time*0.04) % 128 - 128, (S.time*0.07) % 128 - 128);
    ctx.fillRect(0, 0, W+256, H+256);
    ctx.restore();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }
}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = '#03050b';
  ctx.fillRect(0,0,W,H);

  ctx.save();
  const now = performance.now();
  if (now < cam.until){
    const k = clamp((cam.until - now)/cam.span, 0, 1);
    ctx.translate(rand(-cam.mag, cam.mag)*k, rand(-cam.mag, cam.mag)*k);
    ctx.rotate(rand(-0.004, 0.004)*k);
  } else {
    cam.mag = 0;
  }

  drawSky();
  drawStadium();
  drawField();
  drawPost();
  drawParticles();
  drawBall();
  drawAim();
  drawTexts();
  ctx.restore();

  postFX();
}

/* ---------------------------  LOOP  --------------------------- */
const DT = 1/120;
let acc = 0, last = 0, raf = 0, hudTick = 0, lastPaint = 0;

function update(dt){
  S.time += dt*1000;

  if (S.nextIn > 0){
    S.nextIn -= dt;
    if (S.nextIn <= 0){ S.nextIn = 0; nextAttempt(); }
  }

  S.windTimer -= dt;
  if (S.windTimer <= 0){
    S.windTimer  = rand(4,9);
    S.windTarget = rand(-1,1)*W*0.0016;
  }
  S.wind = lerp(S.wind, S.windTarget, clamp(dt*0.6, 0, 1));

  const t = CONFIG.teams[S.team];
  for (let i=0;i<3;i++){
    S.colA[i] = lerp(S.colA[i], t.a[i], clamp(dt*3.2, 0, 1));
    S.colB[i] = lerp(S.colB[i], t.b[i], clamp(dt*3.2, 0, 1));
  }

  ball.update(dt);
  updateParticles(dt);

  S.postGlow = Math.max(0, S.postGlow - dt*1.05);
  S.cheer    = Math.max(0, S.cheer    - dt*0.42);
  S.flash    = Math.max(0, S.flash    - dt*2.6);

  // Play clock
  const k = clamp(S.clock/CONFIG.playClock, 0, 1);
  ui.clock.style.transform = 'scaleX(' + k.toFixed(3) + ')';
  ui.clock.classList.toggle('low', S.clock < 3 && ball.state === 'ready' && S.phase === 'play');

  hudTick += dt;
  if (hudTick > 0.2){
    hudTick = 0;
    const norm = Math.abs(S.wind)/(W*0.0016) * 9 * F.windScale;
    ui.wind.textContent = clamp(norm, 0, 24).toFixed(1);
    ui.arrow.style.transform = 'rotate(' + (S.wind < 0 ? 180 : 0) + 'deg)';
  }
}

function frame(now){
  raf = requestAnimationFrame(frame);
  let dt = (now - last)/1000; last = now;
  if (!(dt > 0)) dt = DT;
  if (dt > 0.25) dt = 0.25;
  // Auto-Lite: laeuft das Geraet dauerhaft unter ~40fps, einmalig
  // auf das sparsame Tier umschalten (deckelt auch DPR via resize)
  PERF.frames++;
  PERF.emaDt = lerp(PERF.emaDt, dt, 0.04);
  if (!PERF.lite && PERF.frames > 120 && PERF.emaDt > 0.024) setLite();
  acc += dt;
  let guard = 0;
  while (acc >= DT && guard++ < 16){ update(DT); acc -= DT; }
  if (guard >= 16) acc = 0;   // kein Update-Stau auf langsamen Geraeten
  // Lite-Tier: Render auf ~60fps deckeln (Logik laeuft weiter).
  // Spart auf 90/120-Hz-Handys fast die Haelfte der GPU-Arbeit.
  if (PERF.lite){
    if (now - lastPaint < 15) return;
    lastPaint = now;
  }
  render();
}

/* ---------------------------  API  --------------------------- */
function openGame(){
  if (S.running) return;
  root.hidden = false;
  S.running = true;
  resize();
  newGame();
  last = performance.now(); acc = 0;
  raf = requestAnimationFrame(frame);
}
function closeGame(){
  if (!S.running) return;
  S.running = false;
  cancelAnimationFrame(raf);
  root.hidden = true;
  if (A.ctx && A.ctx.state === 'running') A.ctx.suspend();
  document.dispatchEvent(new CustomEvent('fieldgoal:close'));
  // Standalone als /football.html geoeffnet (Normalfall als Easter Egg):
  // Schliessen soll zurueck zur App fuehren, sonst staende man vor Schwarz.
  // (Als eingebettetes Overlay via FieldGoal.open() greift dieser Zweig nicht.)
  if (/football\.html?($|[?#])/.test(window.location.pathname + window.location.search)) {
    if (window.history.length > 1) window.history.back();
    else window.location.href = './';
  }
}
document.addEventListener('visibilitychange', () => {
  if (!S.running) return;
  if (document.hidden) cancelAnimationFrame(raf);
  else { last = performance.now(); acc = 0; raf = requestAnimationFrame(frame); }
});

// Oeffentliche API fuers Einbinden: FieldGoal.open() / .close() / .restart()
window.FieldGoal = { open: openGame, close: closeGame, restart: newGame, config: CONFIG };
setMuted(false);
openGame();
})();
</script>
